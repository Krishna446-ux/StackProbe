services:
  postgres:
    image: postgres
    container_name: stackprobe-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postGres
      POSTGRES_DB: stackprobe
    ports:
      - "5432:5432"
    volumes:
      - stackprobe_postgres_data:/var/lib/postgresql


  redis:
    image: redis
    container_name: stackprobe-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  stackprobe_postgres_data:
  redis_data: